apiVersion: v1
kind: Pod
metadata:
  name: pipelinetest
  labels:
    app: pipelinetest
spec:
  serviceAccountName: jenkins
  securityContext:
    fsGroup: 1000
  containers:
    - name: jnlp
      image: jenkins/inbound-agent:latest
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "256Mi"
          cpu: "250m"
      volumeMounts:
        - name: jenkins-home
          mountPath: /home/jenkins/agent

    - name: python
      image: python:3.11-slim
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          memory: "256Mi"
          cpu: "200m"
        limits:
          memory: "512Mi"
          cpu: "500m"
      volumeMounts:
        - name: jenkins-home
          mountPath: /home/jenkins/agent

    - name: terraform
      image: hashicorp/terraform:1.6
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          memory: "256Mi"
          cpu: "200m"
        limits:
          memory: "512Mi"
          cpu: "500m"
      volumeMounts:
        - name: jenkins-home
          mountPath: /home/jenkins/agent

    - name: security-tools
      image: bridgecrew/checkov:3.2.500
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          memory: "256Mi"
          cpu: "200m"
        limits:
          memory: "512Mi"
          cpu: "500m"
      volumeMounts:
        - name: jenkins-home
          mountPath: /home/jenkins/agent

    - name: deploy-container
      image: python:3.11-slim
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          memory: "256Mi"
          cpu: "200m"
        limits:
          memory: "512Mi"
          cpu: "500m"
      volumeMounts:
        - name: jenkins-home
          mountPath: /home/jenkins/agent

  volumes:
    - name: jenkins-home
      persistentVolumeClaim:
        claimName: jenkins-pvc

    - name: k8s-ca
      configMap:
        name: jenkins-ca-cert